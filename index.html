<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigger Auto Sale - Wallet Profile</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/main/app.js"></script>
</head>
<body>

    <div class="wallet-card">
        <div class="wallet-header">
            <h3>Wallet Profile: <span class="highlight">charmingjigger1</span></h3>
            <appkit-button></appkit-button>
        </div>

        <div class="wallet-body">
            <p><strong>Address:</strong> <span class="mono">0x747E15...7a0E19c5</span></p>
            <p><strong>Wallet Type:</strong> <span class="status-tag">EOA (Standard)</span></p>
            <p><strong>Primary Domain:</strong> <span class="mono">charmingjigger.blockchain</span></p>
        </div>

        <div class="network-grid">
            <div class="network-item">Ethereum: <span class="ready">EOA</span></div>
            <div class="network-item">BNB Chain: <span class="ready">EOA</span></div>
            <div class="network-item">Polygon: <span class="ready">EOA</span></div>
            <div class="network-item">TRON: <span class="ready">Connected</span></div>
        </div>

        <div style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd;">
            <p style="margin: 0; font-weight: bold;">Verified Balance:</p>
            <p style="margin: 5px 0 0 0; color: #4CAF50; font-size: 1.2em;">112.555 TRX</p>
            <p style="margin: 0; font-size: 0.8em; color: #888;">Updated: May 2026</p>
        </div>
    </div>

</body>
</html>
